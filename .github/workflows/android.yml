name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@main
    - name: set up JDK 21
      uses: actions/setup-java@main
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build debug
      run: ./gradlew app:assembleDebug
        
    - name: Build release
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: ./gradlew app:assembleRelease

    - name: Rename debug build
      run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

    - uses: noriban/sign-android-release@master
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Upload debug build
      uses: actions/upload-artifact@main
      with:
        archive: false
        path: app/build/ChromeXt_debug.apk

    - name: Rename signed apk
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      run: mv ${{steps.sign_app.outputs.signedReleaseFile}} app/build/ChromeXt_signed.apk

    - name: Upload signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/upload-artifact@main
      with:
        archive: false
        path: app/build/ChromeXt_signed.apk

    - name: Collect debug build
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_debug.apk

    - name: Collect signed APK
      if: ${{ ( github.event_name != 'pull_request' && github.ref == 'refs/heads/master' ) || github.ref_type == 'tag' }}
      uses: actions/download-artifact@main
      with:
        name: ChromeXt_signed.apk
