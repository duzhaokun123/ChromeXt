name: Android CI

on:
  push:
    branches: [ "master" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  IS_RELEASE_BUILD: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag') }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew app:assembleDebug

      - name: Build release APK
        if: env.IS_RELEASE_BUILD == 'true'
        run: ./gradlew app:assembleRelease

      - name: Rename debug APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/ChromeXt_debug.apk

      - name: Sign release APK
        if: env.IS_RELEASE_BUILD == 'true'
        id: sign_app
        uses: noriban/sign-android-release@master
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename signed APK
        if: env.IS_RELEASE_BUILD == 'true'
        run: mv "${{ steps.sign_app.outputs.signedReleaseFile }}" app/build/ChromeXt_signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeXt_debug.apk
          if-no-files-found: error
          archive: false

      - name: Upload signed APK
        if: env.IS_RELEASE_BUILD == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: app/build/ChromeXt_signed.apk
          if-no-files-found: error
          archive: false
